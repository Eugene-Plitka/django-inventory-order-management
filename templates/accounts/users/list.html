{% extends "base.html" %}

{% block title %}
    Users & Roles
{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h1 class="page-title">
            Users & Roles
        </h1>

        <p class="page-subtitle">
            Manage application users and role assignments.
        </p>
    </div>

    <div class="page-header-actions">

        <a
            href="{% url 'accounts_web:user-create' %}"
            class="button button-primary"
        >
            + Add User
        </a>

    </div>

</div>


<div class="card catalog-panel">

    <form
        class="product-filters partner-filters"
        hx-get="{% url 'accounts_web:user-list' %}"
        hx-target="#users-table"
        hx-push-url="true"
        hx-trigger="change, submit"
    >

        <div class="filter-search">

            <span class="filter-search-icon">
                ⌕
            </span>

            <input
                type="search"
                name="search"
                value="{{ search }}"
                placeholder="Search users..."
                hx-get="{% url 'accounts_web:user-list' %}"
                hx-target="#users-table"
                hx-push-url="true"
                hx-trigger="keyup changed delay:350ms"
                hx-include="closest form"
            >

        </div>


        <select name="status">

            <option value="">
                All statuses
            </option>

            <option
                value="active"
                {% if selected_status == "active" %}
                    selected
                {% endif %}
            >
                Active
            </option>

            <option
                value="inactive"
                {% if selected_status == "inactive" %}
                    selected
                {% endif %}
            >
                Inactive
            </option>

        </select>

    </form>


    <div id="users-table">

        {% include "accounts/users/_table.html" %}

    </div>

</div>

{% endblock %}
