{% extends "base.html" %}

{% block title %}
    Manufacturers
{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h1 class="page-title">
            Manufacturers
        </h1>

        <p class="page-subtitle">
            Manage product manufacturers and supplier brands.
        </p>
    </div>

    <div class="page-header-actions">
        {% if perms.catalog.add_manufacturer %}
            <a
                href="{% url 'catalog_web:manufacturer-create' %}"
                class="button button-primary"
            >
                + Add Manufacturer
            </a>
        {% endif %}
    </div>
</div>


<div class="card catalog-panel">

    <form
        class="product-filters category-filters"
        hx-get="{% url 'catalog_web:manufacturer-list' %}"
        hx-target="#manufacturers-table"
        hx-push-url="true"
    >

        <div class="filter-search">
            <span class="filter-search-icon">
                ⌕
            </span>

            <input
                type="search"
                name="search"
                value="{{ search }}"
                placeholder="Search manufacturers..."
                hx-get="{% url 'catalog_web:manufacturer-list' %}"
                hx-target="#manufacturers-table"
                hx-push-url="true"
                hx-trigger="keyup changed delay:350ms"
                hx-include="closest form"
            >
        </div>

    </form>


    <div id="manufacturers-table">
        {% include "catalog/manufacturers/_table.html" %}
    </div>

</div>

{% endblock %}
