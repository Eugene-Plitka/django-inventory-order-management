{% extends "base.html" %}

{% block title %}
    Categories
{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h1 class="page-title">
            Categories
        </h1>

        <p class="page-subtitle">
            Manage product catalog categories.
        </p>
    </div>

    <div class="page-header-actions">
        {% if perms.catalog.add_category %}
            <a
                href="{% url 'catalog_web:category-create' %}"
                class="button button-primary"
            >
                + Add Category
            </a>
        {% endif %}
    </div>
</div>


<div class="card catalog-panel">

    <form
        class="product-filters category-filters"
        hx-get="{% url 'catalog_web:category-list' %}"
        hx-target="#categories-table"
        hx-push-url="true"
    >

        <div class="filter-search">
            <span class="filter-search-icon">
                ⌕
            </span>

            <input
                type="search"
                name="search"
                value="{{ search }}"
                placeholder="Search categories..."
                hx-get="{% url 'catalog_web:category-list' %}"
                hx-target="#categories-table"
                hx-push-url="true"
                hx-trigger="keyup changed delay:350ms"
                hx-include="closest form"
            >
        </div>

    </form>


    <div id="categories-table">
        {% include "catalog/categories/_table.html" %}
    </div>

</div>

{% endblock %}
